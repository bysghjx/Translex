<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>Translex Spam Hider</title></head>
<body>
<script>
  // 重定向到主应用的 Spam 标签页（保旧链接兼容）
  const params = new URLSearchParams(location.search);
  const token = params.get('token') || '';
  location.replace('/?token=' + encodeURIComponent(token) + '#spam');
</script>
<p>Redirecting to dashboard…</p>
</body>
</html>
